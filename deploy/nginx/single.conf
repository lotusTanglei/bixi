server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/auth/ {
        rewrite ^/api/auth/(.*)$ /admin/$1 break;
        proxy_pass http://single:9999;
        proxy_cookie_path /admin /api/;
        # Match the complete authority so registered external OAuth callbacks stay unchanged.
        proxy_redirect http://$http_host/admin/ /api/auth/;
        proxy_redirect https://$http_host/admin/ /api/auth/;
        proxy_redirect http://$proxy_host/admin/ /api/auth/;
        proxy_redirect https://$proxy_host/admin/ /api/auth/;
        proxy_redirect /admin/ /api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://single:9999;
        proxy_cookie_path /admin /api/;
        # Match the complete authority so registered external OAuth callbacks stay unchanged.
        proxy_redirect http://$http_host/admin/ /api/admin/;
        proxy_redirect https://$http_host/admin/ /api/admin/;
        proxy_redirect http://$proxy_host/admin/ /api/admin/;
        proxy_redirect https://$proxy_host/admin/ /api/admin/;
        proxy_redirect /admin/ /api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
