map $http_x_forwarded_proto $bixi_external_scheme {
    https https;
    default $scheme;
}

map $http_upgrade $bixi_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/auth/ {
        client_max_body_size 1m;
        proxy_pass http://gateway:9999/auth/;
        proxy_cookie_path / /api/auth/;
        # Gateway preserves this authority; never rewrite a different host or port.
        proxy_redirect http://$http_host/token/ /api/auth/token/;
        proxy_redirect https://$http_host/token/ /api/auth/token/;
        proxy_redirect http://$proxy_host/token/ /api/auth/token/;
        proxy_redirect https://$proxy_host/token/ /api/auth/token/;
        proxy_redirect /token/ /api/auth/token/;
        proxy_redirect http://$http_host/oauth2/ /api/auth/oauth2/;
        proxy_redirect https://$http_host/oauth2/ /api/auth/oauth2/;
        proxy_redirect http://$proxy_host/oauth2/ /api/auth/oauth2/;
        proxy_redirect https://$proxy_host/oauth2/ /api/auth/oauth2/;
        proxy_redirect /oauth2/ /api/auth/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bixi_external_scheme;
        proxy_buffering off;
    }

    location = /api/admin/file/upload {
        client_max_body_size 100m;
        proxy_pass http://gateway:9999/admin/file/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bixi_external_scheme;
        proxy_buffering off;
    }

    location ~ ^/api/admin/(user|role|post|dept)/import$ {
        client_max_body_size 100m;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://gateway:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bixi_external_scheme;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://gateway:9999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bixi_external_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bixi_connection_upgrade;
        proxy_buffering off;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
