server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/auth/ {
        proxy_pass http://gateway:9999/auth/;
        proxy_cookie_path / /api/auth/;
        # Gateway preserves this authority; never rewrite a different host or port.
        proxy_redirect http://$http_host/token/ /api/auth/token/;
        proxy_redirect https://$http_host/token/ /api/auth/token/;
        proxy_redirect http://$proxy_host/token/ /api/auth/token/;
        proxy_redirect https://$proxy_host/token/ /api/auth/token/;
        proxy_redirect /token/ /api/auth/token/;
        proxy_redirect http://$http_host/oauth2/ /api/auth/oauth2/;
        proxy_redirect https://$http_host/oauth2/ /api/auth/oauth2/;
        proxy_redirect http://$proxy_host/oauth2/ /api/auth/oauth2/;
        proxy_redirect https://$proxy_host/oauth2/ /api/auth/oauth2/;
        proxy_redirect /oauth2/ /api/auth/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://gateway:9999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
