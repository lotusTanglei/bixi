map $http_upgrade $bixi_connection_upgrade {
    default upgrade;
    '' close;
}

map $bixi_public_path $bixi_sms_limit_key {
    default "";
    ~^/api/admin/mobile/[^/]+$ $binary_remote_addr;
}

limit_req_zone $bixi_sms_limit_key zone=bixi_sms:10m rate=6r/m;

server {
    listen 80;
    server_name BIXI_PUBLIC_HOST;
    return 301 https://BIXI_PUBLIC_HOST$request_uri;
}

server {
    listen 443 ssl http2;
    server_name BIXI_PUBLIC_HOST;
    set $bixi_public_path $uri;
    limit_req zone=bixi_sms burst=3 nodelay;
    limit_req_status 429;
    ssl_certificate /etc/bixi/tls/fullchain.pem;
    ssl_certificate_key /etc/bixi/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/bixi/current/ui;
    index index.html;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/auth/ {
        client_max_body_size 1m;
        rewrite ^/api/auth/(.*)$ /admin/$1 break;
        proxy_pass http://127.0.0.1:9999;
        proxy_cookie_path /admin /api/;
        proxy_redirect http://$http_host/admin/ /api/auth/;
        proxy_redirect https://$http_host/admin/ /api/auth/;
        proxy_redirect http://$proxy_host/admin/ /api/auth/;
        proxy_redirect https://$proxy_host/admin/ /api/auth/;
        proxy_redirect /admin/ /api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /api/admin/file/upload {
        client_max_body_size 100m;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9999;
        proxy_cookie_path /admin /api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ~ ^/api/admin/(user|role|post|dept)/import$ {
        client_max_body_size 100m;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9999;
        proxy_cookie_path /admin /api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9999;
        proxy_cookie_path /admin /api/;
        proxy_redirect http://$http_host/admin/ /api/admin/;
        proxy_redirect https://$http_host/admin/ /api/admin/;
        proxy_redirect http://$proxy_host/admin/ /api/admin/;
        proxy_redirect https://$proxy_host/admin/ /api/admin/;
        proxy_redirect /admin/ /api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bixi_connection_upgrade;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
