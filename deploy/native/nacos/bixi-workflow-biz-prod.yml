spring:
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: ${MYSQL_USERNAME}
          password: ${MYSQL_PASSWORD}
          url: ${MYSQL_JDBC_URL}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      validation-query: SELECT 1
      test-while-idle: true
      stat-view-servlet:
        enabled: false

security:
  oauth2:
    ignore:
      urls:
        - /actuator/health
        - /actuator/health/**
        - /error

springdoc:
  api-docs:
    enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/*Mapper.xml
  global-config:
    banner: false
    db-config:
      id-type: auto
      where-strategy: not_empty
      insert-strategy: not_empty
      update-strategy: not_null
  type-handlers-package: com.lotus.bixi.common.mybatis.handler
  configuration:
    jdbc-type-for-null: 'null'
    call-setters-on-nulls: true
    shrink-whitespaces-in-sql: true
