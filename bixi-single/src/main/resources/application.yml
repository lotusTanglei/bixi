spring:
  application:
    name: @project.artifactId@  # 服务名称，取 pom.xml 中的 artifactId
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.amqp.RabbitHealthContributorAutoConfiguration
  # 上传文件大小限制
  servlet:
    multipart:
      max-file-size: 100MB # 单个文件最大
      max-request-size: 100MB # 接收的最大请求大小
  cloud:
    nacos:  # 单机版本关闭nacos 服务发现和配置管理的能力
      config:
        enabled: false
      discovery:
        enabled: false
  freemarker: # freemarker 配置，授权码模式页面渲染使用
    suffix: .ftl
    template-loader-path: classpath:/templates/
    request-context-attribute: request
  main:
    allow-bean-definition-overriding: true # 允许覆盖bean定义
  profiles:
    active: dev  # 激活dev，对应 application-dev.yml

bixi:
  deployment:
    mode: single
  notice:
    default-channel: ${NOTICE_DEFAULT_CHANNEL:IN_APP}
    receipt:
      enabled: ${NOTICE_RECEIPT_ENABLED:false}
      secret: ${NOTICE_RECEIPT_SECRET:}
      signature-header: ${NOTICE_RECEIPT_SIGNATURE_HEADER:X-Bixi-Notice-Signature}
    channels:
      webhook:
        enabled: ${NOTICE_WEBHOOK_ENABLED:false}
        endpoint: ${NOTICE_WEBHOOK_ENDPOINT:}
        bearer-token: ${NOTICE_WEBHOOK_BEARER_TOKEN:}
      email:
        enabled: ${NOTICE_EMAIL_ENABLED:false}
        endpoint: ${NOTICE_EMAIL_ENDPOINT:}
        api-key: ${NOTICE_EMAIL_API_KEY:}
        from: ${NOTICE_EMAIL_FROM:}
      sms:
        enabled: ${NOTICE_SMS_ENABLED:false}
        endpoint: ${NOTICE_SMS_ENDPOINT:}
      wechat:
        enabled: ${NOTICE_WECHAT_ENABLED:false}
        endpoint: ${NOTICE_WECHAT_ENDPOINT:}
  reliable:
    enabled: ${BIXI_RELIABLE_ENABLED:false}
    rabbit:
      enabled: ${BIXI_RELIABLE_RABBIT_ENABLED:false}
      host: ${BIXI_RELIABLE_RABBIT_HOST:${RABBITMQ_HOST:127.0.0.1}}
      port: ${BIXI_RELIABLE_RABBIT_PORT:${RABBITMQ_PORT:5672}}
      username: ${BIXI_RELIABLE_RABBIT_USERNAME:${RABBITMQ_USERNAME:bixi}}
      password: ${BIXI_RELIABLE_RABBIT_PASSWORD:${RABBITMQ_PASSWORD:}}
      virtual-host: ${BIXI_RELIABLE_RABBIT_VIRTUAL_HOST:${RABBITMQ_VIRTUAL_HOST:/}}

# Generator is available in the shared single-process application by default;
# set GENERATOR_ENABLED=false to remove its controllers and services at startup.
generator:
  enabled: ${GENERATOR_ENABLED:true}

workflow:
  enabled: ${WORKFLOW_ENABLED:false}
  database-schema-update: ${WORKFLOW_SCHEMA_UPDATE:false}
  async-executor-activate: ${WORKFLOW_ASYNC_EXECUTOR_ACTIVATE:true}
  public-start-models: ${WORKFLOW_PUBLIC_START_MODELS:}

# AI is opt-in in the single-process runtime. Set AI_ENABLED=true together
# with DASHSCOPE_API_KEY to install the AI routes and provider.
ai:
  enabled: ${AI_ENABLED:false}

flowable:
  check-process-definitions: false


# mybatis-plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/*Mapper.xml # mapper文件位置
  global-config:
    banner: false # 是否打印 mybatis-plus banner
    db-config:
      id-type: auto  # 主键类型
      where-strategy: not_empty # where 条件策略
      insert-strategy: not_empty # 插入策略
      update-strategy: not_null  # 更新策略
  type-handlers-package: com.lotus.bixi.common.mybatis.handler # 类型处理器包
  configuration:
    jdbc-type-for-null: 'null' # 是否设置字段为null
    call-setters-on-nulls: true # 是否调用set方法时传入null值
    shrink-whitespaces-in-sql: true # 去掉sql中多余的空格
