server:
  port: 9999    # 项目端口
  servlet:
    context-path: /admin  # 项目访问路径


## spring security 对外暴露接口设置（不鉴权直接可访问）
security:
  oauth2:
    ignore:
      urls:
        - /webjars/**
        - /v3/api-docs/**
        - /doc.html
        - /swagger-ui.html
        - /swagger-ui/**
        - /swagger-resources
        - /error
        - /token/**
        - /actuator/**
        - /code/**
        - /druid/**
  encode-key: 'bixi:hello,world'
  ignore-clients:
    - bixi
    - test

spring:
  # RabbitMQ 配置：部署时通过环境变量替换占位默认值
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
  cache:
    type: redis # 缓存类型 Redis
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  # 数据源
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: ${MYSQL_USERNAME:root}
          password: ${MYSQL_PASSWORD:bixi}
          url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bixi_single}?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowMultiQueries=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true
    druid:
      # 初始化大小，最小，最大
      initial-size: 5
      min-idle: 5
      max-active: 20
      # 配置获取连接等待超时的时间
      max-wait: 60000
      # 配置间隔多久进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      # 用来检测连接是否有效的SQL，必须是一个查询语句
      validation-query: SELECT 1
      # 配置间隔多久进行一次连接有效性检测，0是不检测，单位是毫秒
      validation-query-timeout: 10000
      # 配置一个连接的TTL，超过这个时间的连接将由连接池自动断开重新建立连接
      connection-error-retry-attempts: 5000
      # 配置测试连接是否可用的特定属性
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      filters: stat,wall,slf4j
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connectionProperties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=1000
      # 配置DruidStatFilter
      web-stat-filter:
        enabled: true
        url-pattern: "/*"
        exclusions: "*.js,*.gif,*.jpg,*.bmp,*.png,*.css,*.ico,/druid/*"
      # 配置DruidStatViewServlet
      stat-view-servlet:
        enabled: true
        url-pattern: "/druid/*"
        # IP白名单(没有配置或者为空，则允许所有访问)
        allow:
        # IP黑名单 (存在共同时，deny优先于allow)
        deny:
        #  禁用HTML页面上的“Reset All”功能
        reset-enable: false
        # 登录名
        login-username: bixi
        # 登录密码
        login-password: 123456

file:
  bucket: bixi
  oss:
    enable: true
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9800}
    access-key: ${MINIO_ACCESS_KEY:minio}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}

# 配置文件加密根密码
jasypt:
  encryptor:
    # 指定密钥，非生产环境可以指明在配置文件中，生产环境请删除此配置项，通过启动命令添加 -Djasypt.encryptorpassword=bixi 实现。
    password: bixi
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator


# swagger 配置
swagger:
  token-url: ${swagger.gateway}/admin/oauth2/token
