# Cloud-only overlay for a two-replica Workflow deployment.
# Both services intentionally share the base service definition, database and
# Nacos application name; only the Flowable lock owner is replica-specific.
services:
  workflow-a:
    extends:
      file: compose.yaml
      service: workflow
    profiles: [workflow-cluster]
    environment:
      WORKFLOW_LOCK_OWNER: workflow-a
      WORKFLOW_ASYNC_JOB_LOCK_TIME: ${WORKFLOW_ASYNC_JOB_LOCK_TIME:-PT30S}
      WORKFLOW_TIMER_LOCK_TIME: ${WORKFLOW_TIMER_LOCK_TIME:-PT30S}
      WORKFLOW_RESET_EXPIRED_JOBS_INTERVAL: ${WORKFLOW_RESET_EXPIRED_JOBS_INTERVAL:-PT5S}
      WORKFLOW_DEFAULT_ASYNC_JOB_ACQUIRE_WAIT_TIME: ${WORKFLOW_DEFAULT_ASYNC_JOB_ACQUIRE_WAIT_TIME:-PT1S}
      WORKFLOW_DEFAULT_TIMER_JOB_ACQUIRE_WAIT_TIME: ${WORKFLOW_DEFAULT_TIMER_JOB_ACQUIRE_WAIT_TIME:-PT1S}
      WORKFLOW_MAX_ASYNC_JOBS_DUE_PER_ACQUISITION: ${WORKFLOW_MAX_ASYNC_JOBS_DUE_PER_ACQUISITION:-4}
      WORKFLOW_MAX_TIMER_JOBS_PER_ACQUISITION: ${WORKFLOW_MAX_TIMER_JOBS_PER_ACQUISITION:-4}
      WORKFLOW_RESET_EXPIRED_JOBS_PAGE_SIZE: ${WORKFLOW_RESET_EXPIRED_JOBS_PAGE_SIZE:-100}
      WORKFLOW_RESET_EXPIRED_JOB_ENABLED: ${WORKFLOW_RESET_EXPIRED_JOB_ENABLED:-true}
      WORKFLOW_UNLOCK_OWNED_JOBS: ${WORKFLOW_UNLOCK_OWNED_JOBS:-true}

  workflow-b:
    extends:
      file: compose.yaml
      service: workflow
    profiles: [workflow-cluster]
    environment:
      WORKFLOW_LOCK_OWNER: workflow-b
      WORKFLOW_ASYNC_JOB_LOCK_TIME: ${WORKFLOW_ASYNC_JOB_LOCK_TIME:-PT30S}
      WORKFLOW_TIMER_LOCK_TIME: ${WORKFLOW_TIMER_LOCK_TIME:-PT30S}
      WORKFLOW_RESET_EXPIRED_JOBS_INTERVAL: ${WORKFLOW_RESET_EXPIRED_JOBS_INTERVAL:-PT5S}
      WORKFLOW_DEFAULT_ASYNC_JOB_ACQUIRE_WAIT_TIME: ${WORKFLOW_DEFAULT_ASYNC_JOB_ACQUIRE_WAIT_TIME:-PT1S}
      WORKFLOW_DEFAULT_TIMER_JOB_ACQUIRE_WAIT_TIME: ${WORKFLOW_DEFAULT_TIMER_JOB_ACQUIRE_WAIT_TIME:-PT1S}
      WORKFLOW_MAX_ASYNC_JOBS_DUE_PER_ACQUISITION: ${WORKFLOW_MAX_ASYNC_JOBS_DUE_PER_ACQUISITION:-4}
      WORKFLOW_MAX_TIMER_JOBS_PER_ACQUISITION: ${WORKFLOW_MAX_TIMER_JOBS_PER_ACQUISITION:-4}
      WORKFLOW_RESET_EXPIRED_JOBS_PAGE_SIZE: ${WORKFLOW_RESET_EXPIRED_JOBS_PAGE_SIZE:-100}
      WORKFLOW_RESET_EXPIRED_JOB_ENABLED: ${WORKFLOW_RESET_EXPIRED_JOB_ENABLED:-true}
      WORKFLOW_UNLOCK_OWNED_JOBS: ${WORKFLOW_UNLOCK_OWNED_JOBS:-true}
