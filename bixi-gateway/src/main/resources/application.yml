server:
  port: 9999

spring:
  application:
    name: @artifactId@
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:@nacos.namespace@}
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        watch:
          enabled: true
        watch-delay: 1000
      config:
        namespace: ${NACOS_NAMESPACE:@nacos.namespace@}
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
  config:
    import:
      - optional:nacos:application-@profiles.active@.yml
      - optional:nacos:${spring.application.name}-@profiles.active@.yml
      - optional:nacos:${spring.application.name}-dtp-@profiles.active@.yml

# Cloud Gateway validates opaque reference tokens against Auth before routing.
# Compose overrides the URI with the internal `auth` service name.
bixi:
  gateway:
    security:
      introspection-uri: ${BIXI_GATEWAY_SECURITY_INTROSPECTION_URI:http://127.0.0.1:3000/token/check_token}
      request-timeout: ${BIXI_GATEWAY_SECURITY_REQUEST_TIMEOUT:3s}
