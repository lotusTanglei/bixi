image: maven:3.8.8-eclipse-temurin-17

stages:
  - build
  - test
  - acceptance
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository/
    - bixi-ui/node_modules/

build_frontend:
  image: node:18
  stage: build
  before_script:
    - apt-get update && apt-get install -y make
  script:
    - make frontend-ci
  artifacts:
    paths:
      - bixi-ui/dist/

test_backend_cloud:
  stage: test
  before_script:
    - apt-get update && apt-get install -y make
  script:
    - make backend-cloud-ci

test_backend_single:
  stage: test
  before_script:
    - apt-get update && apt-get install -y make
  script:
    - make backend-single-ci

test_workflow_optional_engines:
  stage: test
  script:
    - mvn -Pcloud,workflow-all-engines-test -pl bixi-common/bixi-common-workflow -am -Dtest=WorkflowEngineConfigurationTest -Dsurefire.failIfNoSpecifiedTests=false test
  artifacts:
    when: always
    reports:
      junit: bixi-common/bixi-common-workflow/target/surefire-reports/TEST-*.xml

test_workflow_mysql:
  stage: test
  parallel:
    matrix:
      - WORKFLOW_TEST_PROFILE: [cloud, single]
  services:
    - name: mysql:8.0.45
      alias: workflow-mysql
  variables:
    MYSQL_DATABASE: workflow_approval_test
    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    MYSQL_ROOT_HOST: "%"
    WORKFLOW_TEST_JDBC_URL: "jdbc:mysql://workflow-mysql:3306/workflow_approval_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai"
    WORKFLOW_TEST_DB_USER: root
    WORKFLOW_TEST_DB_PASSWORD: ""
  before_script:
    - apt-get update && apt-get install -y default-mysql-client
    - timeout 120 bash -c 'until mysql -hworkflow-mysql -uroot -e "SELECT 1" >/dev/null 2>&1; do sleep 2; done'
  script:
    - mvn -P"$WORKFLOW_TEST_PROFILE" -pl bixi-module/bixi-workflow-biz -am -Dtest=WorkflowApprovalIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false test
  artifacts:
    when: always
    reports:
      junit: bixi-module/bixi-workflow-biz/target/surefire-reports/TEST-*.xml

accept_dual_mode:
  image: docker:27.5-cli
  stage: acceptance
  services:
    - name: docker:27.5-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache apache2-utils curl make nodejs openssl
  script:
    - make init-env
    - make start-cloud
    - make verify-cloud
    - make start-single
    - make verify-single
  after_script:
    - make status || true
    - make stop || true

package_backend_cloud:
  stage: package
  script:
    - mvn -Pcloud package -DskipTests
  artifacts:
    paths:
      - "**/target/*.jar"

package_backend_single:
  stage: package
  script:
    - mvn -Psingle -pl bixi-single -am package -DskipTests
  artifacts:
    paths:
      - "bixi-single/target/*.jar"
