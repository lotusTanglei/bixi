# 如下配置为使用数据库存储定时任务，属性不经常修改，所以不放在 application.yml 中统一管理
spring:
  quartz:
    properties:
      org:
        quartz:
          scheduler:
            instanceName: clusteredScheduler
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore # 数据库存储
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate # 数据库代理
            tablePrefix: QRTZ_ # 表前缀
            isClustered: true # 集群
            clusterCheckinInterval: 30000 # 集群检查间隔
            useProperties: false
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool # 线程池
            threadCount: 50 # 线程数量
            threadPriority: 5 # 线程优先级
            threadsInheritContextClassLoaderOfInitializingThread: true # 是否继承类加载器
    job-store-type: jdbc # 持久化到数据库
    jdbc:
      initialize-schema: never # 不初始化表结构
bixi:
  quartz:
    rest:
      # Connect/read timeout for outbound REST tasks; keep this finite and bounded by the implementation.
      timeout-millis: ${BIXI_QUARTZ_REST_TIMEOUT_MILLIS:5000}
      # Maximum response bytes consumed by a successful REST task; bounded by the implementation.
      max-response-bytes: ${BIXI_QUARTZ_REST_MAX_RESPONSE_BYTES:1048576}
      # Comma-separated exact host names/IPs. Leave empty in production; use only for reviewed local/test endpoints.
      allowed-hosts: ${BIXI_QUARTZ_REST_ALLOWED_HOSTS:}
