server:
  port: 5000

bixi:
  deployment:
    mode: ${BIXI_DEPLOYMENT_MODE:cloud}

ai:
  enabled: ${AI_ENABLED:false}

spring:
  application:
    name: @artifactId@
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: @nacos.namespace@
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: @nacos.namespace@
  config:
    import:
      - nacos:application-@profiles.active@.yml
      - nacos:${spring.application.name}-@profiles.active@.yml
      - optional:nacos:${spring.application.name}-dtp-@profiles.active@.yml
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        enabled: ${AI_CHAT_ENABLED:${AI_ENABLED:false}}
        options:
          model: ${AI_CHAT_MODEL:qwen-plus}
          temperature: ${AI_CHAT_TEMPERATURE:0.7}
      embedding:
        enabled: ${AI_EMBEDDING_ENABLED:${AI_ENABLED:false}}
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v2}
